[package]
name = "sre"
version = "0.1.0"
edition = "2021"
description = "Agentic SRE - closed-loop incident triage on Kubernetes with an approval-gated remediation, built on the OpenAI Responses API and the embedded StackQL MCP server"
license = "MIT"
publish = false

[[bin]]
name = "sre"
path = "src/main.rs"

[dependencies]
stackql-mcp = "0.12"
rmcp = { version = "2.2", default-features = false, features = ["client", "transport-async-rw"] }
async-openai = { version = "0.42", default-features = false, features = ["responses", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-std", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
