[project]
name = "finops"
version = "0.1.0"
description = "FinOps cost optimisation audit: a scheduled, read-only sweep on the OpenAI Agents SDK with the StackQL MCP server as the tool surface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.22,<1",
    "stackql-mcp-server>=0.12.718",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
finops = "finops.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
